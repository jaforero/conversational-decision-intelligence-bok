name: Deploy CDI-BoK to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Set up Node.js for browser-local embeddings
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Restore incremental semantic cache
        uses: actions/cache@v4
        with:
          path: .semantic-cache
          key: semantic-q8-v1-${{ runner.os }}-${{ hashFiles('docs/**/*.md', 'semantic/model.mjs') }}
          restore-keys: |
            semantic-q8-v1-${{ runner.os }}-

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Run release preflight
        run: python scripts/preflight_release.py

      - name: Install pinned semantic build tools
        run: npm install --prefix semantic --no-package-lock --no-audit --no-fund

      - name: Test hybrid retrieval and Markdown chunking
        run: node --test semantic/tests.mjs

      - name: Stage verified ONNX model entirely on Pages
        run: node semantic/download-model.mjs

      - name: Build incremental E5 embeddings and BM25 index
        run: node semantic/index.mjs

      - name: Calibrate abstention and measure recall
        run: node semantic/evaluate.mjs

      - name: Vendor browser runtime and validate complete artifact
        run: |
          node semantic/build.mjs
          node semantic/validate.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    name: Publish
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
