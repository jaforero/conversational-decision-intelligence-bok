name: Validate CDI-BoK

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  preflight:
    name: Governance, content and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node.js for browser-local embeddings
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Restore incremental semantic cache
        uses: actions/cache@v4
        with:
          path: .semantic-cache
          key: semantic-q8-v1-${{ runner.os }}-${{ hashFiles('docs/**/*.md', 'semantic/model.mjs') }}
          restore-keys: |
            semantic-q8-v1-${{ runner.os }}-

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Run current portal preflight
        run: python scripts/preflight_release.py

      - name: Install pinned semantic build tools
        run: npm install --prefix semantic --no-package-lock --no-audit --no-fund

      - name: Test hybrid retrieval and Markdown chunking
        run: node --test semantic/tests.mjs

      - name: Stage verified ONNX model entirely on Pages
        run: node semantic/download-model.mjs

      - name: Build incremental E5 embeddings and BM25 index
        run: node semantic/index.mjs

      - name: Calibrate abstention and measure recall
        run: node semantic/evaluate.mjs

      - name: Vendor browser runtime and validate complete artifact
        run: |
          node semantic/build.mjs
          node semantic/validate.mjs
