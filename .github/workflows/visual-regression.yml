name: Visual and accessibility regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  browser-quality:
    name: Browser quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Restore incremental semantic cache
        uses: actions/cache@v4
        with:
          path: .semantic-cache
          key: semantic-q8-v1-${{ runner.os }}-${{ hashFiles('docs/**/*.md', 'semantic/model.mjs') }}
          restore-keys: |
            semantic-q8-v1-${{ runner.os }}-

      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Install browser test dependencies
        run: npm ci

      - name: Build and audit the portal
        run: python scripts/preflight_release.py

      - name: Install pinned semantic build tools
        run: npm install --prefix semantic --no-package-lock --no-audit --no-fund

      - name: Test hybrid retrieval and Markdown chunking
        run: node --test semantic/tests.mjs

      - name: Stage verified ONNX model entirely on Pages
        run: node semantic/download-model.mjs

      - name: Build incremental E5 embeddings and BM25 index
        run: node semantic/index.mjs

      - name: Calibrate abstention and measure recall
        run: node semantic/evaluate.mjs

      - name: Vendor browser runtime and validate complete artifact
        run: |
          node semantic/build.mjs
          node semantic/validate.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run visual and accessibility tests
        run: npm test

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
